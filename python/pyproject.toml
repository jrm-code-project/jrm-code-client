[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jrm-code-client"
version = "0.1.0"
description = "Python client bindings for the JRM Code Project API (https://jrm-code-project.com)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "responses>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]
